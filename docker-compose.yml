services:
  # ── Databases (separate per service – microservice rule) ─────────────────
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       orders
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./order-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       payments
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - payments-data:/var/lib/postgresql/data
      - ./payment-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Cache ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Message Broker ─────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"   # NATS client port
      - "8222:8222"   # NATS monitoring port
    command: ["-js", "-sd", "/data"]  # Enable JetStream + persist to /data
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 10s

  # ── Services ──────────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    restart: on-failure
    ports:
      - "8080:8080"
      - "50052:50052"
    env_file:
      - .env
    depends_on:
      orders-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: on-failure
    ports:
      - "8081:8081"
      - "50051:50051"
    env_file:
      - .env
    depends_on:
      payments-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: on-failure
    env_file:
      - .env
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  orders-data:
  payments-data:
  nats-data: